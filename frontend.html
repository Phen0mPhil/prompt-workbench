<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt & Note Workbench</title>
<style>
  :root {
    --bg-app: #121214;
    --bg-surface: #18181b;
    --border-subtle: #27272a;
    --border-hover: #52525b;
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-muted: #71717a;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: rgba(37, 99, 235, 0.16);
    --success: #10b981;
    --success-soft: rgba(16, 185, 129, 0.16);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.15);

    --tint-default-bg: #18181b; --tint-default-border: #27272a;
    --tint-red-bg:     #261618; --tint-red-border:     #4c2328;
    --tint-orange-bg:  #261b14; --tint-orange-border:  #4d311e;
    --tint-yellow-bg:  #242114; --tint-yellow-border:  #49411e;
    --tint-green-bg:   #15231b; --tint-green-border:   #234632;
    --tint-blue-bg:    #151e29; --tint-blue-border:    #233954;
    --tint-indigo-bg:  #191729; --tint-indigo-border:  #2e2954;
    --tint-violet-bg:  #211626; --tint-violet-border:  #42244f;
    --tint-white-bg:   #f4f4f5; --tint-white-border:   #d4d4d8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg-app); color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  body { display: flex; flex-direction: column; overflow-x: hidden; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2e34; border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: #45454f; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 30;
    background: rgba(18, 18, 20, 0.94); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 10px 20px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .brand {
    display: flex; align-items: center; gap: 8px; font-weight: 700;
    font-size: 14px; color: var(--text-secondary); user-select: none;
  }
  .brand-badge {
    background: var(--accent-soft); color: #60a5fa;
    border: 1px solid rgba(96, 165, 250, 0.25);
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px;
  }

  .search-wrap {
    flex: 1; min-width: 200px; max-width: 580px;
    position: relative; display: flex; align-items: center;
  }
  .search-icon { position: absolute; left: 12px; color: var(--text-muted); pointer-events: none; font-size: 13px; }
  #globalSearch {
    width: 100%; background: var(--bg-surface); border: 1px solid var(--border-subtle);
    color: var(--text-primary); padding: 8px 32px 8px 34px; border-radius: 9px; font-size: 13.5px;
  }
  #globalSearch:focus { outline: none; border-color: var(--accent); }
  .clear-search {
    position: absolute; right: 8px; background: transparent; border: none;
    color: var(--text-muted); cursor: pointer; padding: 4px; display: none;
  }

  button, select {
    font-family: inherit; font-size: 12.5px; font-weight: 600; border-radius: 8px;
    padding: 7px 12px; cursor: pointer; border: 1px solid transparent;
    transition: all 0.14s ease; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--bg-surface); color: var(--text-secondary); border-color: var(--border-subtle); }
  .btn-secondary:hover { background: #242429; color: var(--text-primary); border-color: var(--border-hover); }
  .btn-secondary.active-tab { background: #27272a; color: #fff; border-color: #52525b; }
  .btn-danger { background: var(--danger-soft); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.25); }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.28); color: #fff; }

  .btn-workspace-toggle { background: #1e293b; color: #93c5fd; border: 1px solid #334155; }
  .btn-workspace-toggle.has-items { background: #1d4ed8; color: #fff; border-color: #3b82f6; }
  .btn-workspace-toggle.in-workspace { background: #27272a; color: #f4f4f5; border-color: #52525b; }

  .icon-btn {
    padding: 5px 8px; font-size: 12px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.06); color: var(--text-secondary);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .icon-btn:hover, .icon-btn.active {
    background: rgba(255, 255, 255, 0.15); color: #fff; border-color: rgba(255, 255, 255, 0.22);
  }

  .sub-drawer {
    display: none; align-items: center; gap: 8px; padding: 7px 12px;
    background: rgba(0, 0, 0, 0.32); border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-wrap: wrap;
  }
  .sub-drawer.open { display: flex; }
  .color-dots { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .color-dot {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid rgba(255, 255, 255, 0.22); transition: transform 0.12s;
  }
  .color-dot:hover { transform: scale(1.15); }
  .color-dot.active { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 0 2px rgba(255,255,255,0.2); }
  .size-select { background: #1c1c21; color: var(--text-primary); border: 1px solid #3f3f46; padding: 4px 8px; font-size: 12px; border-radius: 6px; }

  .word-search-box {
    display: flex; align-items: center; gap: 4px; flex: 1;
    background: #141418; border: 1px solid #3f3f46; border-radius: 7px; padding: 3px 6px;
  }
  .word-search-box:focus-within { border-color: var(--accent); }
  .word-search-input { flex: 1; min-width: 90px; background: transparent; border: none; color: var(--text-primary); font-size: 12.5px; padding: 3px 6px; outline: none; }
  .match-counter { font-size: 11.5px; color: var(--text-secondary); padding: 0 6px; border-right: 1px solid #2e2e36; white-space: nowrap; }
  .nav-match-btn { padding: 3px 7px; font-size: 11px; border-radius: 5px; background: transparent; color: var(--text-secondary); border: none; }
  .nav-match-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  mark.search-hl { background: rgba(250, 204, 21, 0.35); color: #fef08a; border-radius: 2px; padding: 0 1px; }
  mark.search-hl.current { background: #f97316; color: #fff; outline: 1px solid #fdba74; }

  /* TINTS & WHITES */
  .tint-default { background: var(--tint-default-bg); border-color: var(--tint-default-border); }
  .tint-red     { background: var(--tint-red-bg);     border-color: var(--tint-red-border); }
  .tint-orange  { background: var(--tint-orange-bg);  border-color: var(--tint-orange-border); }
  .tint-yellow  { background: var(--tint-yellow-bg);  border-color: var(--tint-yellow-border); }
  .tint-green   { background: var(--tint-green-bg);   border-color: var(--tint-green-border); }
  .tint-blue    { background: var(--tint-blue-bg);    border-color: var(--tint-blue-border); }
  .tint-indigo  { background: var(--tint-indigo-bg);  border-color: var(--tint-indigo-border); }
  .tint-violet  { background: var(--tint-violet-bg);  border-color: var(--tint-violet-border); }
  
  .tint-white { background: var(--tint-white-bg); border-color: var(--tint-white-border); color: #121214 !important; }
  .tint-white .card-title, .tint-white .rich-editor, .tint-white .ws-title-input { color: #121214 !important; }
  .tint-white .card-preview { color: #3f3f46 !important; background: rgba(0,0,0,0.05); }
  .tint-white .ws-compact-header, .tint-white .ws-pane-footer { background: #e4e4e7; border-color: #d4d4d8; color: #121214; }
  .tint-white .icon-btn { color: #3f3f46; border-color: #d4d4d8; background: rgba(0,0,0,0.05); }
  .tint-white .icon-btn:hover { background: #d4d4d8; color: #000; }
  .tint-white .sub-drawer { background: #f4f4f5; border-color: #d4d4d8; }

  /* LIBRARY MASONRY */
  #libraryView { flex: 1; padding: 20px 24px 60px; max-width: 2400px; width: 100%; margin: 0 auto; }
  .library-meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: var(--text-muted); font-size: 13px; flex-wrap: wrap; gap: 10px; }
  .staged-pills { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .staged-chip { background: var(--accent-soft); border: 1px solid rgba(59, 130, 246, 0.3); color: #93c5fd; font-size: 12px; padding: 3px 10px; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; }
  .staged-chip button { background: transparent; border: none; color: #93c5fd; padding: 0 2px; font-size: 13px; }

  .masonry { column-count: 5; column-gap: 16px; }
  @media (max-width: 1800px) { .masonry { column-count: 4; } }
  @media (max-width: 1300px) { .masonry { column-count: 3; } }
  @media (max-width: 860px)  { .masonry { column-count: 2; } }
  @media (max-width: 540px)  { .masonry { column-count: 1; } }

  .card { break-inside: avoid; border-radius: 12px; padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; border: 1px solid var(--tint-default-border); }
  .card:hover { transform: translateY(-2px); border-color: var(--border-hover); }
  .card.is-staged { box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.45); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .card-title { font-weight: 700; font-size: 15px; line-height: 1.35; word-break: break-word; }
  .pointer-badge { font-size: 11px; color: #60a5fa; background: rgba(37,99,235,0.12); padding: 2px 7px; border-radius: 6px; font-family: monospace; word-break: break-all; }
  .stage-btn { padding: 4px 9px; font-size: 11.5px; border-radius: 7px; background: rgba(255, 255, 255, 0.06); color: var(--text-secondary); border: 1px solid rgba(255, 255, 255, 0.08); flex-shrink: 0; }
  .stage-btn.staged { background: var(--success-soft); color: #34d399; border-color: rgba(16, 185, 129, 0.35); }
  .card-preview { font-size: 13px; line-height: 1.5; color: #d4d4d8; display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; background: rgba(0, 0, 0, 0.22); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.04); word-break: break-word; }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .tag { background: rgba(255, 255, 255, 0.08); color: var(--text-secondary); font-size: 11.5px; padding: 3px 9px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; }
  .tag-remove { background: transparent; border: none; color: var(--text-muted); padding: 0 2px; font-size: 12px; cursor: pointer; }
  .tag-remove:hover { color: #fca5a5; }
  .add-tag-row { display: flex; align-items: center; gap: 6px; }
  .add-tag-input { background: rgba(0, 0, 0, 0.28); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 7px; color: var(--text-primary); font-size: 12px; padding: 5px 9px; width: 160px; }
  .add-tag-input:focus { outline: none; border-color: var(--accent); }

  .rich-editor { width: 100%; flex: 1; overflow-y: auto; outline: none; font-size: 14px; line-height: 1.6; padding: 16px; white-space: pre-wrap; word-break: break-word; }
  .rich-editor:empty:before { content: attr(data-placeholder); color: var(--text-muted); pointer-events: none; }
  .rich-editor b, .rich-editor strong { font-weight: 700; }
  .rich-editor i, .rich-editor em { font-style: italic; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 60; }
  .modal-backdrop.open { display: flex; }
  .modal-card { width: 100%; max-width: 880px; height: 88vh; border-radius: 14px; border: 1px solid #3f3f46; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7); }
  .modal-top { padding: 10px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; gap: 8px; background: rgba(0, 0, 0, 0.22); flex-wrap: wrap; }
  .modal-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .modal-title-input { background: transparent; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 19px; font-weight: 700; padding: 12px 16px; width: 100%; }
  .modal-title-input:focus { outline: none; border-bottom-color: var(--accent); }
  .modal-tags-bar { padding: 8px 16px; border-top: 1px solid rgba(255, 255, 255, 0.07); background: rgba(0, 0, 0, 0.16); display: flex; flex-direction: column; gap: 7px; }
  .modal-bottom { padding: 10px 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; align-items: center; gap: 10px; background: rgba(0, 0, 0, 0.24); }

  /* WORKSPACE */
  #workspaceView { display: none; flex: 1; height: calc(100vh - 55px); padding: 10px 12px 12px; gap: 10px; overflow-x: auto; }
  #workspaceView.active { display: grid; }
  #workspaceView.cols-1 { grid-template-columns: 1fr; }
  #workspaceView.cols-2 { grid-template-columns: repeat(2, minmax(340px, 1fr)); }
  #workspaceView.cols-3 { grid-template-columns: repeat(3, minmax(340px, 1fr)); }
  .ws-pane { border-radius: 11px; border: 1px solid var(--border-subtle); display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; }
  .ws-pane.active-pane { border: 2px solid var(--accent) !important; box-shadow: 0 0 15px rgba(37, 99, 235, 0.25); }
  .ws-compact-header { padding: 6px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.24); }
  .ws-pane-index { font-size: 10.5px; font-weight: 700; background: rgba(255, 255, 255, 0.1); color: var(--text-secondary); padding: 2px 6px; border-radius: 5px; flex-shrink: 0; }
  .ws-title-input { flex: 1; min-width: 60px; background: transparent; border: 1px solid transparent; border-radius: 5px; font-size: 14px; font-weight: 700; padding: 3px 6px; }
  .ws-title-input:focus { outline: none; background: rgba(0, 0, 0, 0.3); border-color: var(--accent); }
  .ws-icon-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .ws-pane-footer { padding: 6px 10px; border-top: 1px solid rgba(255, 255, 255, 0.07); background: rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; gap: 5px; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #27272a; color: #fff; border: 1px solid #3f3f46; padding: 9px 16px; border-radius: 9px; font-size: 13px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <header>
    <div class="header-left">
      <button id="workspaceToggleBtn" class="btn-workspace-toggle" onclick="toggleViewMode()">Workspace (0/3)</button>
      <button class="btn-primary" onclick="createNewNote()">+ New Note</button>
      <button class="btn-secondary" onclick="linkFileByPath()" title="Link local file pointer">Link File</button>
      <button class="btn-secondary" onclick="triggerImport()" title="Import into app">Import</button>
      <input type="file" id="importFileInput" accept=".txt,.html,.htm,.md,.docx,.pdf" style="display:none" onchange="importFileUpload(event)">
      <button class="btn-secondary" id="trashTabBtn" onclick="toggleTrashView()">Trash (0)</button>
    </div>
    <div class="search-wrap" id="librarySearchContainer">
      <span class="search-icon">🔍</span>
      <input id="globalSearch" type="text" placeholder="Search notes by title, keyword, or #tag..." oninput="handleSearchInput()">
      <button class="clear-search" id="clearSearchBtn" onclick="clearGlobalSearch()">✕</button>
    </div>
    <div class="brand"><span class="brand-badge" id="totalCountBadge">0 notes</span><span>Prompt & Note Workbench</span></div>
  </header>

  <main id="libraryView">
    <div class="library-meta-bar">
      <div id="filterStatusText">Showing active notes</div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button id="emptyTrashBtn" class="btn-danger" style="display:none; padding:4px 10px; font-size:12px;" onclick="emptyTrash()">Empty Trash</button>
        <div class="staged-pills" id="stagedPillsContainer"></div>
      </div>
    </div>
    <div class="masonry" id="masonryGrid"></div>
  </main>
  <section id="workspaceView"></section>

  <!-- NOTE MODAL -->
  <div class="modal-backdrop" id="noteModal" onclick="if(event.target.id==='noteModal') closeModal()">
    <div class="modal-card tint-default" id="modalCard">
      <div class="modal-top">
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
          <button class="icon-btn" id="modalPaletteBtn" onclick="toggleDrawer('modalPaletteDrawer', 'modalPaletteBtn')">🎨 Color</button>
          <button class="icon-btn" id="modalFormatBtn" onclick="toggleDrawer('modalFormatDrawer', 'modalFormatBtn')"><b>Aa</b> Format</button>
          <button class="icon-btn" id="modalFindBtn" onclick="toggleDrawer('modalFindDrawer', 'modalFindBtn', 'modalFindInput')">🔍 Find</button>
          <button id="modalReloadBtn" class="icon-btn" style="display:none;" onclick="reloadLinkedFile(activeModalNoteId)">↻ Reload</button>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button id="modalStageBtn" class="stage-btn" onclick="toggleModalWorkspaceStage()">+ Open in Workspace</button>
          <button id="modalRestoreBtn" class="btn-primary" style="display:none; padding:5px 10px;" onclick="restoreNote(activeModalNoteId)">Restore</button>
          <button id="modalDeleteBtn" class="btn-danger" style="padding:5px 10px;" onclick="deleteCurrentModalNote()">Delete Note</button>
        </div>
      </div>

      <div class="sub-drawer" id="modalPaletteDrawer"><div class="color-dots" id="modalColorDots"></div></div>
      <div class="sub-drawer" id="modalFormatDrawer">
        <button class="icon-btn" onmousedown="event.preventDefault(); execFmt('bold')" title="Bold"><b>B</b></button>
        <button class="icon-btn" onmousedown="event.preventDefault(); execFmt('italic')" title="Italic"><i>I</i></button>
        <button class="icon-btn" onmousedown="event.preventDefault(); toggleCase()" title="Uppercase Selection"><b>C</b></button>
        <button class="icon-btn" onmousedown="event.preventDefault(); execFmt('undo')" title="Undo (Ctrl+Z)">↶</button>
        <select class="size-select" onchange="applyFontSizePreset('modalEditor', this.value); this.value='';">
          <option value="" disabled selected>Font Size...</option>
          <option value="12px">Small (12px)</option><option value="14px">Normal (14px)</option>
          <option value="17px">Medium (17px)</option><option value="21px">Large (21px)</option>
          <option value="26px">Extra Large (26px)</option>
        </select>
      </div>
      <div class="sub-drawer" id="modalFindDrawer">
        <div class="word-search-box">
          <input type="text" class="word-search-input" id="modalFindInput" placeholder="Find in note..." oninput="runEditorSearch('modalEditor', this.value, 'modalFindCount')" onkeydown="if(event.key==='Enter'){event.preventDefault(); stepEditorSearch('modalEditor', event.shiftKey ? -1 : 1, 'modalFindCount');}">
          <span class="match-counter" id="modalFindCount">0 of 0</span>
          <button class="nav-match-btn" onclick="stepEditorSearch('modalEditor', -1, 'modalFindCount')">▲</button>
          <button class="nav-match-btn" onclick="stepEditorSearch('modalEditor', 1, 'modalFindCount')">▼</button>
        </div>
        <button class="icon-btn" onclick="closeSearchDrawer('modalEditor', 'modalFindDrawer', 'modalFindBtn', 'modalFindInput', 'modalFindCount')">✕</button>
      </div>

      <div class="modal-body" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='f'){event.preventDefault();toggleDrawer('modalFindDrawer','modalFindBtn','modalFindInput');}">
        <input type="text" id="modalTitle" class="modal-title-input" placeholder="Note Title..." oninput="autoSaveModal()">
        <div id="modalPointerDisplay" class="pointer-badge" style="display:none; margin: 8px 16px 0;"></div>
        <div id="modalEditor" class="rich-editor" contenteditable="true" data-placeholder="Write or paste content here..." oninput="autoSaveModal()"></div>
      </div>

      <div class="modal-tags-bar">
        <div class="tags" id="modalTagsList"></div>
        <div class="add-tag-row">
          <input type="text" id="modalNewTagInput" class="add-tag-input" placeholder="New tag name..." onkeydown="if(event.key==='Enter'){event.preventDefault(); addTagFromModal();}">
          <button class="icon-btn" onclick="addTagFromModal()">+ Add Tag</button>
        </div>
      </div>
      <div class="modal-bottom">
        <div style="display:flex; gap:8px;">
          <button class="btn-secondary" onclick="saveAsWithFolderPicker(activeModalNoteId)">Save As...</button>
          <button class="btn-secondary" onclick="copyModalContent(this)">Copy Text</button>
        </div>
        <button class="btn-primary" onclick="closeModal()">Done</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  const MAX_WORKSPACE_PANES = 3;
  const TINT_OPTIONS = [
    { id: 'default', label: 'Default', swatch: '#27272a' },
    { id: 'red',     label: 'Red',     swatch: '#991b1b' },
    { id: 'orange',  label: 'Orange',  swatch: '#9a3412' },
    { id: 'yellow',  label: 'Yellow',  swatch: '#854d0e' },
    { id: 'green',   label: 'Green',   swatch: '#166534' },
    { id: 'blue',    label: 'Blue',    swatch: '#1e40af' },
    { id: 'indigo',  label: 'Indigo',  swatch: '#3730a3' },
    { id: 'violet',  label: 'Violet',  swatch: '#6b21a8' },
    { id: 'white',   label: 'White',   swatch: '#f4f4f5' }
  ];

  let notes = [];
  let workspaceIds = [];
  let currentMode = 'library';
  let viewingTrash = false;
  let activeModalNoteId = null;
  let saveTimer = null;
  let activePaneId = null;
  let dirtyFileNotes = new Set();
  const searchState = {};

  async function loadState() {
    try {
      const res = await fetch('/api/state');
      const data = await res.json();
      notes = Array.isArray(data.notes) ? data.notes : [];
      workspaceIds = Array.isArray(data.workspaceIds) ? data.workspaceIds.filter(id => notes.some(n => n.id === id && !n.trashed)).slice(0, MAX_WORKSPACE_PANES) : [];
    } catch (e) { notes = []; workspaceIds = []; }
    buildModalPaletteDots();
    renderLibrary();
  }

  function queueSaveState() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try {
        await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes, workspaceIds }) });
      } catch (e) {}
    }, 300);
  }

  async function flushStateNow() {
    clearTimeout(saveTimer);
    try {
      await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes, workspaceIds }) });
    } catch (e) {}
  }

  function escapeHTML(str) {
    return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
  }
  function stripSearchHighlights(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('mark.search-hl').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    tmp.normalize();
    return tmp.innerHTML;
  }
  function stripHTML(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || '';
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function execFmt(cmd) { document.execCommand(cmd, false, null); }
  function applyFontSizePreset(editorId, pxSize) {
    if (!pxSize) return;
    const editor = document.getElementById(editorId);
    if (!editor) return;
    editor.focus();
    const sel = window.getSelection();
    if (!sel.rangeCount || sel.isCollapsed) return;
    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return;
    const span = document.createElement('span');
    span.style.fontSize = pxSize;
    try { range.surroundContents(span); } catch (e) {
      const frag = range.extractContents(); span.appendChild(frag); range.insertNode(span);
    }
    editor.dispatchEvent(new Event('input'));
  }

  function setActivePane(id) {
    activePaneId = id;
    document.querySelectorAll('.ws-pane').forEach(p => p.classList.remove('active-pane'));
    const pane = document.getElementById('ws-pane-container-' + id);
    if (pane) pane.classList.add('active-pane');
  }

  function toggleCase() {
    const sel = window.getSelection();
    if (!sel.isCollapsed) document.execCommand('insertText', false, sel.toString().toUpperCase());
  }

  function markFileDirty(id) {
    const note = notes.find(n => n.id === id);
    if (note && note.filePath) dirtyFileNotes.add(id);
  }

  async function silentSaveToDisk(id) {
    const note = notes.find(n => n.id === id);
    if (!note || !note.filePath) return;
    const cleanHtml = stripSearchHighlights(note.bodyHtml);
    const isHtml = note.filePath.toLowerCase().endsWith('.html') || note.filePath.toLowerCase().endsWith('.htm');
    try {
      await fetch('/api/save-note', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filePath: note.filePath, content: isHtml ? cleanHtml : stripHTML(cleanHtml) })
      });
    } catch (e) {}
  }

  setInterval(() => {
    if (dirtyFileNotes.size > 0) {
      dirtyFileNotes.forEach(id => silentSaveToDisk(id));
      dirtyFileNotes.clear();
    }
  }, 2500);

  function toggleDrawer(drawerId, btnId, focusInputId = null) {
    const drawer = document.getElementById(drawerId);
    const btn = document.getElementById(btnId);
    const willOpen = !drawer.classList.contains('open');
    drawer.classList.toggle('open', willOpen);
    if (btn) btn.classList.toggle('active', willOpen);
    if (willOpen && focusInputId) setTimeout(() => document.getElementById(focusInputId)?.focus(), 10);
  }

  function clearHighlightsInDOM(editor) {
    editor.querySelectorAll('mark.search-hl').forEach(mark => mark.replaceWith(document.createTextNode(mark.textContent)));
    editor.normalize();
  }

  function runEditorSearch(editorId, query, counterId) {
    const editor = document.getElementById(editorId);
    const counter = document.getElementById(counterId);
    if (!editor) return;
    clearHighlightsInDOM(editor);
    const q = query.trim();
    if (!q) { searchState[editorId] = { index: -1, total: 0 }; if (counter) counter.textContent = '0 of 0'; return; }
    
    const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) { if (node.nodeValue.trim() !== '') textNodes.push(node); }
    
    const lowerQ = q.toLowerCase();
    textNodes.forEach(tNode => {
      const text = tNode.nodeValue;
      let idx = text.toLowerCase().indexOf(lowerQ);
      if (idx === -1) return;
      const frag = document.createDocumentFragment();
      let lastIdx = 0;
      while (idx !== -1) {
        if (idx > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, idx)));
        const mark = document.createElement('mark');
        mark.className = 'search-hl';
        mark.textContent = text.slice(idx, idx + q.length);
        frag.appendChild(mark);
        lastIdx = idx + q.length;
        idx = text.toLowerCase().indexOf(lowerQ, lastIdx);
      }
      if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
      tNode.parentNode.replaceChild(frag, tNode);
    });
    
    const marks = editor.querySelectorAll('mark.search-hl');
    searchState[editorId] = { index: marks.length > 0 ? 0 : -1, total: marks.length };
    highlightActiveMatch(editorId, counterId);
  }

  function stepEditorSearch(editorId, delta, counterId) {
    const state = searchState[editorId];
    if (!state || state.total === 0) return;
    state.index = (state.index + delta + state.total) % state.total;
    highlightActiveMatch(editorId, counterId);
  }

  function highlightActiveMatch(editorId, counterId) {
    const editor = document.getElementById(editorId);
    const counter = document.getElementById(counterId);
    const state = searchState[editorId];
    const marks = editor.querySelectorAll('mark.search-hl');
    marks.forEach((m, i) => m.classList.toggle('current', i === state.index));
    if (state.total > 0 && marks[state.index]) {
      marks[state.index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      if (counter) counter.textContent = `${state.index + 1} of ${state.total}`;
    } else if (counter) counter.textContent = '0 of 0';
  }

  function closeSearchDrawer(editorId, drawerId, btnId, inputId, counterId) {
    const editor = document.getElementById(editorId);
    if (editor) clearHighlightsInDOM(editor);
    const inp = document.getElementById(inputId);
    if (inp) inp.value = '';
    const cnt = document.getElementById(counterId);
    if (cnt) cnt.textContent = '0 of 0';
    document.getElementById(drawerId)?.classList.remove('open');
    document.getElementById(btnId)?.classList.remove('active');
  }

  async function linkFileByPath() {
    const filePath = prompt('Enter full file path to link:');
    if (!filePath || !filePath.trim()) return;
    try {
      const res = await fetch('/api/link-file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filePath: filePath.trim() }) });
      if (!res.ok) { showToast(await res.text()); return; }
      const data = await res.json();
      notes.unshift({ id: Date.now(), title: data.title, tags: ['linked-file'], bodyHtml: escapeHTML(data.content).replace(/\n/g, '<br>'), color: 'blue', filePath: data.filePath, trashed: false, updatedAt: Date.now() });
      queueSaveState(); viewingTrash = false; renderLibrary(); showToast(`Linked pointer: ${data.title}`);
    } catch (e) { showToast('Failed to link file'); }
  }

  async function reloadLinkedFile(id) {
    const note = notes.find(n => n.id === id);
    if (!note || !note.filePath) return;
    try {
      const res = await fetch('/api/link-file', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filePath: note.filePath }) });
      if (!res.ok) { showToast('File not found'); return; }
      const data = await res.json();
      note.bodyHtml = escapeHTML(data.content).replace(/\n/g, '<br>'); note.updatedAt = Date.now(); queueSaveState();
      if (activeModalNoteId === id) document.getElementById('modalEditor').innerHTML = note.bodyHtml;
      if (currentMode === 'workspace') renderWorkspace(); else renderLibrary();
      showToast('Reloaded text from disk');
    } catch (e) { showToast('Reload failed'); }
  }

  function triggerImport() { document.getElementById('importFileInput').click(); }
  async function importFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const formData = new FormData(); formData.append('file', file);
    try {
      const res = await fetch('/api/import', { method: 'POST', body: formData });
      if (!res.ok) { showToast(await res.text()); return; }
      const data = await res.json();
      notes.unshift({ id: Date.now(), title: data.title, tags: [], bodyHtml: escapeHTML(data.content).replace(/\n/g, '<br>'), color: 'default', trashed: false, updatedAt: Date.now() });
      queueSaveState(); viewingTrash = false; renderLibrary(); showToast(`Imported "${data.title}"`);
    } catch (e) { showToast('Import failed'); }
    event.target.value = '';
  }

  async function writeNoteToDefaultDir(note) {
    if (!note || note.trashed) return;
    const cleanHtml = stripSearchHighlights(note.bodyHtml);
    const plain = stripHTML(cleanHtml);
    if (!note.title.trim() && !plain.trim()) return;
    const safeName = (note.title.trim() || 'note_' + note.id).replace(/[^a-z0-9_\\-\\. ]/gi, '_') + '.txt';
    try {
      const res = await fetch('/api/save-default', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fileName: safeName, content: plain }) });
      if (res.ok && !note.filePath) {
        const data = await res.json();
        note.filePath = data.filePath;
      }
    } catch (e) {}
  }

  async function saveAsWithFolderPicker(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    try {
      const pickRes = await fetch('/api/pick-folder');
      if (!pickRes.ok) { showToast('Folder selection cancelled'); return; }
      const { folder } = await pickRes.json();
      const defaultName = (note.title.trim() || 'note').replace(/[^a-z0-9_\\-\\. ]/gi, '_') + '.txt';
      const fileName = prompt('Enter filename (e.g., .txt, .html):', defaultName);
      if (!fileName || !fileName.trim()) return;
      const sep = folder.includes('\\\\') ? '\\\\' : '/';
      const fullPath = folder.replace(/[\\\\\\/]+$/, '') + sep + fileName.trim();
      const cleanHtml = stripSearchHighlights(note.bodyHtml);
      const isHtml = fileName.trim().toLowerCase().endsWith('.html') || fileName.trim().toLowerCase().endsWith('.htm');
      
      const saveRes = await fetch('/api/save-note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ filePath: fullPath, content: isHtml ? cleanHtml : stripHTML(cleanHtml) }) });
      if (!saveRes.ok) { showToast(await saveRes.text()); return; }
      const data = await saveRes.json();
      note.filePath = data.filePath; note.updatedAt = Date.now();
      await flushStateNow();
      if (activeModalNoteId === id) {
        const ptr = document.getElementById('modalPointerDisplay');
        ptr.style.display = 'block'; ptr.textContent = 'File Path: ' + note.filePath;
        document.getElementById('modalReloadBtn').style.display = 'inline-flex';
      }
      showToast('Saved to ' + note.filePath);
    } catch (e) { showToast('Save As failed'); }
  }

  function toggleTrashView() {
    if (currentMode === 'workspace') switchToLibrary();
    viewingTrash = !viewingTrash; renderLibrary();
  }

  function toggleWorkspaceStage(id, event) {
    if (event) event.stopPropagation();
    const note = notes.find(n => n.id === id);
    if (!note || note.trashed) return;
    const idx = workspaceIds.indexOf(id);
    if (idx !== -1) {
      workspaceIds.splice(idx, 1); showToast(`Removed "${note.title || 'Untitled'}"`);
    } else {
      if (workspaceIds.length >= MAX_WORKSPACE_PANES) { showToast('Workspace full (3/3).'); return; }
      workspaceIds.push(id); showToast(`Staged (${workspaceIds.length}/3)`);
    }
    queueSaveState(); renderLibrary();
    if (activeModalNoteId === id) updateModalStageButton();
  }

  function toggleViewMode() {
    if (currentMode === 'library') {
      if (workspaceIds.length === 0) { showToast('Stage notes first'); return; }
      currentMode = 'workspace';
      document.getElementById('libraryView').style.display = 'none';
      document.getElementById('librarySearchContainer').style.visibility = 'hidden';
      document.getElementById('workspaceView').classList.add('active');
      updateHeaderUI(); renderWorkspace();
    } else switchToLibrary();
  }

  function switchToLibrary() {
    currentMode = 'library';
    document.getElementById('workspaceView').classList.remove('active');
    document.getElementById('libraryView').style.display = 'block';
    document.getElementById('librarySearchContainer').style.visibility = 'visible';
    renderLibrary();
  }

  function updateHeaderUI() {
    const btn = document.getElementById('workspaceToggleBtn');
    if (currentMode === 'workspace') {
      btn.textContent = '← Main Library'; btn.className = 'btn-workspace-toggle in-workspace';
    } else {
      btn.textContent = `Workspace (${workspaceIds.length}/${MAX_WORKSPACE_PANES})`;
      btn.className = workspaceIds.length > 0 ? 'btn-workspace-toggle has-items' : 'btn-workspace-toggle';
    }
    const trashBtn = document.getElementById('trashTabBtn');
    trashBtn.textContent = `Trash (${notes.filter(n => n.trashed).length})`;
    trashBtn.classList.toggle('active-tab', viewingTrash && currentMode === 'library');
    document.getElementById('totalCountBadge').textContent = `${notes.filter(n => !n.trashed).length} notes`;
  }

  function handleSearchInput() {
    const val = document.getElementById('globalSearch').value;
    document.getElementById('clearSearchBtn').style.display = val ? 'block' : 'none';
    renderLibrary();
  }
  function clearGlobalSearch() {
    document.getElementById('globalSearch').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    renderLibrary();
  }

  function renderLibrary() {
    updateHeaderUI();
    const query = document.getElementById('globalSearch').value.trim().toLowerCase();
    const grid = document.getElementById('masonryGrid');
    const pool = notes.filter(n => Boolean(n.trashed) === viewingTrash);
    document.getElementById('emptyTrashBtn').style.display = (viewingTrash && pool.length > 0) ? 'inline-flex' : 'none';
    
    if (viewingTrash) {
      document.getElementById('stagedPillsContainer').innerHTML = '';
      document.getElementById('filterStatusText').textContent = `Trash Bin (${pool.length} notes)`;
    } else {
      document.getElementById('filterStatusText').textContent = `Showing ${pool.length} active notes`;
      document.getElementById('stagedPillsContainer').innerHTML = workspaceIds.map((id, idx) => {
        const n = notes.find(item => item.id === id);
        return n ? `<span class="staged-chip">Pane ${idx + 1}: ${escapeHTML(n.title || 'Untitled')} <button onclick="toggleWorkspaceStage(${id}, event)">✕</button></span>` : '';
      }).join('');
    }

    const filtered = pool.filter(note => {
      if (!query) return true;
      const cleanQ = query.startsWith('#') ? query.slice(1) : query;
      return note.title.toLowerCase().includes(query) || stripHTML(note.bodyHtml).toLowerCase().includes(query) || note.tags.some(t => t.toLowerCase().includes(cleanQ));
    });

    grid.innerHTML = filtered.map(note => {
      const isStaged = workspaceIds.includes(note.id);
      const ptrHtml = note.filePath ? `<div class="pointer-badge">📎 ${escapeHTML(note.filePath)}</div>` : '';
      return `
        <article class="card tint-${escapeHTML(note.color)} ${isStaged ? 'is-staged' : ''}" onclick="openNoteModal(${note.id})">
          <div class="card-head">
            <h3 class="card-title">${escapeHTML(note.title || 'Untitled Note')}</h3>
            ${!viewingTrash ? `<button class="stage-btn ${isStaged ? 'staged' : ''}" onclick="toggleWorkspaceStage(${note.id}, event)">${isStaged ? `Pane ${workspaceIds.indexOf(note.id) + 1} ✓` : '+ Workspace'}</button>` : ''}
          </div>
          ${ptrHtml}
          <div class="card-preview">${note.bodyHtml || '<span style="color:#71717a">(Empty note)</span>'}</div>
          ${note.tags.length ? `<div class="tags">${note.tags.map(t => `<span class="tag">#${escapeHTML(t)}</span>`).join('')}</div>` : ''}
        </article>`;
    }).join('');
  }

  function buildModalPaletteDots() {
    const container = document.getElementById('modalColorDots');
    if (container) container.innerHTML = TINT_OPTIONS.map(t => `<span class="color-dot" data-color="${t.id}" title="${t.label}" style="background:${t.swatch};" onclick="setModalColor('${t.id}')"></span>`).join('');
  }

  function createNewNote() {
    viewingTrash = false;
    const newNote = { id: Date.now(), title: '', tags: [], bodyHtml: '', color: 'default', trashed: false, updatedAt: Date.now() };
    notes.unshift(newNote); queueSaveState(); renderLibrary(); openNoteModal(newNote.id, true);
  }

  function openNoteModal(id, focusTitle = false) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    activeModalNoteId = id;
    document.getElementById('modalCard').className = `modal-card tint-${note.color}`;
    document.getElementById('modalTitle').value = note.title;
    document.getElementById('modalEditor').innerHTML = note.bodyHtml;
    document.getElementById('modalNewTagInput').value = '';
    renderModalTagPills();

    const ptr = document.getElementById('modalPointerDisplay');
    const reloadBtn = document.getElementById('modalReloadBtn');
    if (note.filePath) {
      ptr.style.display = 'block'; ptr.textContent = 'Linked File Pointer: ' + note.filePath; reloadBtn.style.display = 'inline-flex';
    } else {
      ptr.style.display = 'none'; reloadBtn.style.display = 'none';
    }

    document.getElementById('modalRestoreBtn').style.display = note.trashed ? 'inline-flex' : 'none';
    document.getElementById('modalDeleteBtn').textContent = note.trashed ? 'Delete Permanently' : 'Delete Note';
    document.getElementById('modalStageBtn').style.display = note.trashed ? 'none' : 'inline-flex';
    document.querySelectorAll('#modalColorDots .color-dot').forEach(d => d.classList.toggle('active', d.dataset.color === note.color));
    updateModalStageButton();

    ['modalPaletteDrawer', 'modalFormatDrawer', 'modalFindDrawer'].forEach(d => document.getElementById(d)?.classList.remove('open'));
    ['modalPaletteBtn', 'modalFormatBtn', 'modalFindBtn'].forEach(b => document.getElementById(b)?.classList.remove('active'));

    document.getElementById('noteModal').classList.add('open');
    if (focusTitle) document.getElementById('modalTitle').focus();
  }

  async function closeModal() {
    const editor = document.getElementById('modalEditor');
    const closingId = activeModalNoteId;
    if (editor && closingId !== null) {
      clearHighlightsInDOM(editor);
      autoSaveModal();
      const note = notes.find(n => n.id === closingId);
      await writeNoteToDefaultDir(note);
      await flushStateNow();
    }
    document.getElementById('noteModal').classList.remove('open');
    activeModalNoteId = null;
    if (currentMode === 'library') renderLibrary(); else renderWorkspace();
  }

  function renderModalTagPills() {
    const note = notes.find(n => n.id === activeModalNoteId);
    if (!note) return;
    document.getElementById('modalTagsList').innerHTML = note.tags.map((tag, idx) => `<span class="tag">#${escapeHTML(tag)} <button class="tag-remove" onclick="removeModalTag(${idx})">✕</button></span>`).join('');
  }

  function addTagFromModal() {
    const note = notes.find(n => n.id === activeModalNoteId);
    const input = document.getElementById('modalNewTagInput');
    if (!note || !input) return;
    const raw = input.value.trim().replace(/^#/, '');
    if (raw && !note.tags.includes(raw)) { note.tags.push(raw); note.updatedAt = Date.now(); queueSaveState(); }
    input.value = ''; renderModalTagPills();
  }
  function removeModalTag(idx) {
    const note = notes.find(n => n.id === activeModalNoteId);
    if (note) { note.tags.splice(idx, 1); note.updatedAt = Date.now(); queueSaveState(); renderModalTagPills(); }
  }
  function setModalColor(color) {
    const note = notes.find(n => n.id === activeModalNoteId);
    if (note) { note.color = color; queueSaveState(); document.getElementById('modalCard').className = `modal-card tint-${color}`; document.querySelectorAll('#modalColorDots .color-dot').forEach(d => d.classList.toggle('active', d.dataset.color === color)); }
  }
  function toggleModalWorkspaceStage() { if (activeModalNoteId !== null) toggleWorkspaceStage(activeModalNoteId); }
  function updateModalStageButton() {
    const btn = document.getElementById('modalStageBtn');
    const idx = workspaceIds.indexOf(activeModalNoteId);
    btn.textContent = idx !== -1 ? `In Workspace (Pane ${idx + 1}) ✓` : '+ Open in Workspace';
    btn.classList.toggle('staged', idx !== -1);
  }
  function autoSaveModal() {
    const note = notes.find(n => n.id === activeModalNoteId);
    if (note) { note.title = document.getElementById('modalTitle').value; note.bodyHtml = stripSearchHighlights(document.getElementById('modalEditor').innerHTML); note.updatedAt = Date.now(); queueSaveState(); markFileDirty(activeModalNoteId); }
  }
  function deleteCurrentModalNote() {
    const note = notes.find(n => n.id === activeModalNoteId);
    if (!note) return;
    if (note.trashed) { notes = notes.filter(n => n.id !== activeModalNoteId); showToast('Permanently deleted'); }
    else { note.trashed = true; workspaceIds = workspaceIds.filter(id => id !== activeModalNoteId); showToast('Moved to Trash'); }
    queueSaveState(); closeModal();
  }
  function restoreNote(id) { const note = notes.find(n => n.id === id); if (note) { note.trashed = false; queueSaveState(); closeModal(); showToast('Restored'); } }
  function emptyTrash() { if (confirm('Empty Trash?')) { notes = notes.filter(n => !n.trashed); queueSaveState(); renderLibrary(); showToast('Trash emptied'); } }
  function copyModalContent(btn) { navigator.clipboard.writeText(stripHTML(document.getElementById('modalEditor').innerHTML)); btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy Text', 1200); }

  function renderWorkspace() {
    const container = document.getElementById('workspaceView');
    if (workspaceIds.length === 0) { switchToLibrary(); return; }
    container.className = `active cols-${workspaceIds.length}`;
    container.innerHTML = workspaceIds.map((id, idx) => {
      const note = notes.find(n => n.id === id);
      if (!note) return '';
      const dots = TINT_OPTIONS.map(t => `<span class="color-dot ${note.color===t.id?'active':''}" title="${t.label}" style="width:16px;height:16px;background:${t.swatch};" onclick="setPaneColor(${id},'${t.id}')"></span>`).join('');
      const tagPills = note.tags.map((tag, tIdx) => `<span class="tag">#${escapeHTML(tag)} <button class="tag-remove" onclick="removePaneTag(${id}, ${tIdx})">✕</button></span>`).join('');

      return `
        <div class="ws-pane tint-${escapeHTML(note.color)}" id="ws-pane-container-${id}" onmousedown="setActivePane(${id})" onkeydown="if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='f'){event.preventDefault();toggleDrawer('ws-find-${id}','ws-find-btn-${id}','ws-find-in-${id}');}">
          <div class="ws-compact-header">
            <span class="ws-pane-index">P${idx + 1}</span>
            <input type="text" class="ws-title-input" value="${escapeHTML(note.title)}" placeholder="Untitled..." oninput="updatePaneTitle(${id}, this.value)">
            <div class="ws-icon-group">
              <button class="icon-btn" id="ws-pal-btn-${id}" onclick="toggleDrawer('ws-pal-${id}','ws-pal-btn-${id}')" title="Color">🎨</button>
              <button class="icon-btn" id="ws-fmt-btn-${id}" onclick="toggleDrawer('ws-fmt-${id}','ws-fmt-btn-${id}')" title="Formatting"><b>Aa</b></button>
              <button class="icon-btn" id="ws-find-btn-${id}" onclick="toggleDrawer('ws-find-${id}','ws-find-btn-${id}','ws-find-in-${id}')" title="Find">🔍</button>
              ${note.filePath ? `<button class="icon-btn" onclick="reloadLinkedFile(${id})" title="Reload">↻</button>` : ''}
              <button class="icon-btn" onclick="saveAsWithFolderPicker(${id})" title="Save As...">💾</button>
              <button class="icon-btn" onclick="closeWorkspacePane(${id})" title="Close">✕</button>
            </div>
          </div>
          <div class="sub-drawer" id="ws-pal-${id}"><div class="color-dots">${dots}</div></div>
          <div class="sub-drawer" id="ws-fmt-${id}">
            <button class="icon-btn" onmousedown="event.preventDefault(); execFmt('bold')"><b>B</b></button>
            <button class="icon-btn" onmousedown="event.preventDefault(); execFmt('italic')"><i>I</i></button>
            <button class="icon-btn" onmousedown="event.preventDefault(); toggleCase()"><b>C</b></button>
            <button class="icon-btn" onmousedown="event.preventDefault(); execFmt('undo')">↶</button>
            <select class="size-select" onchange="applyFontSizePreset('ws-ed-${id}', this.value); this.value='';">
              <option value="" disabled selected>Size...</option><option value="12px">Small</option><option value="14px">Normal</option><option value="17px">Medium</option><option value="21px">Large</option><option value="26px">XL</option>
            </select>
          </div>
          <div class="sub-drawer" id="ws-find-${id}">
            <div class="word-search-box">
              <input type="text" class="word-search-input" id="ws-find-in-${id}" placeholder="Find in Pane ${idx + 1}..." oninput="runEditorSearch('ws-ed-${id}', this.value, 'ws-cnt-${id}')" onkeydown="if(event.key==='Enter'){event.preventDefault(); stepEditorSearch('ws-ed-${id}', event.shiftKey ? -1 : 1, 'ws-cnt-${id}');}">
              <span class="match-counter" id="ws-cnt-${id}">0 of 0</span>
              <button class="nav-match-btn" onclick="stepEditorSearch('ws-ed-${id}', -1, 'ws-cnt-${id}')">▲</button>
              <button class="nav-match-btn" onclick="stepEditorSearch('ws-ed-${id}', 1, 'ws-cnt-${id}')">▼</button>
            </div>
            <button class="icon-btn" onclick="closeSearchDrawer('ws-ed-${id}','ws-find-${id}','ws-find-btn-${id}','ws-find-in-${id}','ws-cnt-${id}')">✕</button>
          </div>
          <div id="ws-ed-${id}" class="rich-editor" contenteditable="true" data-placeholder="Edit note directly..." oninput="updatePaneBody(${id}, this.innerHTML)">${note.bodyHtml}</div>
          <div class="ws-pane-footer">
            <div class="tags" id="ws-tags-${id}">${tagPills}</div>
            <div class="add-tag-row">
              <input type="text" class="add-tag-input" id="ws-tag-in-${id}" placeholder="Add tag..." onkeydown="if(event.key==='Enter'){event.preventDefault(); addPaneTag(${id});}">
              <button class="icon-btn" onclick="addPaneTag(${id})">+ Tag</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function closeWorkspacePane(id) { workspaceIds = workspaceIds.filter(x => x !== id); queueSaveState(); updateHeaderUI(); if (workspaceIds.length === 0) switchToLibrary(); else renderWorkspace(); }
  function updatePaneTitle(id, val) { const n = notes.find(x => x.id === id); if (n) { n.title = val; queueSaveState(); } }
  function updatePaneBody(id, html) { const n = notes.find(x => x.id === id); if (n) { n.bodyHtml = stripSearchHighlights(html); queueSaveState(); markFileDirty(id); } }
  function addPaneTag(id) {
    const n = notes.find(x => x.id === id); const inp = document.getElementById(`ws-tag-in-${id}`);
    if (!n || !inp) return; const raw = inp.value.trim().replace(/^#/, '');
    if (raw && !n.tags.includes(raw)) { n.tags.push(raw); queueSaveState(); }
    inp.value = ''; renderWorkspace();
  }
  function removePaneTag(id, tIdx) { const n = notes.find(x => x.id === id); if (n) { n.tags.splice(tIdx, 1); queueSaveState(); renderWorkspace(); } }
  function setPaneColor(id, color) { const n = notes.find(x => x.id === id); if (n) { n.color = color; queueSaveState(); renderWorkspace(); } }

  loadState();
</script>
</body>
</html>
